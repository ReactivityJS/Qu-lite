# Qu Lite relay/mirror + client start page + demo. One service, one port:
#   http://localhost:8787/                      start page: connection check, how apps connect
#   http://localhost:8787/demo.html?name=alice  and  ?name=bob
# Behind a TLS reverse proxy bind it to localhost only, e.g. "127.0.0.1:8787:8787" (docs/DEPLOY.md).
# The relay only ever stores sealed envelopes (it can verify, never read).
#
#   docker compose up --build
services:
  qu-lite:
    build: .
    image: qu-lite
    ports:
      - "8787:8787"
    environment:
      # QU_ALLOW: comma-separated sids to restrict this mirror to (empty = any self-certified space)
      QU_ALLOW: ""
      # per-space quota (empty = unlimited), max envelope size, inbound frames/s per connection (0 = off)
      QU_QUOTA_RECORDS: ""
      QU_QUOTA_BYTES: "1073741824"
      QU_MAX_ENVELOPE: "262144"
      # most spaces this relay accepts (empty = unlimited) - anyone can create spaces, so set it for a public relay
      QU_MAX_SPACES: ""
      QU_RATE: "200"
      # enables /stats (JSON) and /metrics (Prometheus) for requests with "Authorization: Bearer <token>" (empty = off)
      QU_STATS_TOKEN: ""
    volumes:
      - qu-lite-data:/data
    restart: unless-stopped

volumes:
  qu-lite-data:
