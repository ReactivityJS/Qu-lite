# Qu Lite relay/mirror + client start page + demo. One service, one port:
#   http://localhost:8787/                      start page: connection check, how apps connect
#   http://localhost:8787/demo.html?name=alice  and  ?name=bob
# The relay only ever stores sealed envelopes (it can verify, never read).
#
#   cp .env.example .env      # settings (optional - the defaults below apply without it)
#   docker compose up -d --build
#
# Step by step on a server: docs/INSTALL.md. TLS reverse proxy: docs/DEPLOY.md.
services:
  qu-lite:
    build: .
    image: qu-lite
    ports:
      # 127.0.0.1: reachable only from this machine (the reverse proxy); 0.0.0.0 to expose the port directly
      - "${QU_BIND:-127.0.0.1}:${QU_PUBLISH_PORT:-8787}:8787"
    environment:
      QU_ALLOW: "${QU_ALLOW:-}"
      QU_QUOTA_RECORDS: "${QU_QUOTA_RECORDS:-}"
      QU_QUOTA_BYTES: "${QU_QUOTA_BYTES:-1073741824}"
      QU_MAX_ENVELOPE: "${QU_MAX_ENVELOPE:-262144}"
      QU_MAX_SPACES: "${QU_MAX_SPACES:-}"
      QU_RATE: "${QU_RATE:-200}"
      QU_STATS_TOKEN: "${QU_STATS_TOKEN:-}"
    volumes:
      - qu-lite-data:/data
    restart: unless-stopped

volumes:
  qu-lite-data:
